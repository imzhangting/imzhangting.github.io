<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no, email=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1208" />

    <title>命理排盘 - 玄妙易理</title>
    <meta name="description" content="输入生辰干支，探索命运玄机。玄妙易理命理排盘。" />
    <meta name="keywords" content="命理排盘,八字,干支,玄妙易理" />

    <meta property="og:title" content="命理排盘 - 玄妙易理" />
    <meta property="og:description" content="输入生辰干支 · 探索命运玄机" />
    <meta property="og:type" content="website" />

    <link href="./css/main.css" rel="stylesheet" />
</head>

<body>
    <div class="app_wrapper">
        <div class="page-header">
            <div class="page-header-logo">
                <div class="page-header-icon">
                    <span class="page-header-icon-text">命</span>
                </div>
                <span class="page-header-logo-text">玄妙易理</span>
            </div>
            <div class="page-header-tools"><div class="btn-goback"><span class="btn-goback-text">← 返回</span></div></div>
        </div>
        <div class="page-body">
            <div class="page-body-title">
                <span class="page-body-title-text">命理排盘</span>
                <span class="page-body-title-text-sub">输入生辰干支 · 探索命运玄机</span>
                <span class="page-body-title-hr"></span>
            </div>
            <div class="form_warpper">
                <div class="form-item">
                    <div class="form-item-label"><span class="form-item-label__icon">*</span><span class="form-item-label__text">姓名</span></div>
                    <div class="form-item-value"><input type="text" class="form-item-value__input" placeholder="请输入姓名" style="text-align: left;" /></div>
                </div>
                <div class="form-item">
                    <div class="form-item-label"><span class="form-item-label__icon">*</span><span class="form-item-label__text">性别</span></div>
                    <div class="form-item-value">
                        <div class="btn-group">
                            <div class="btn is-active"><span class="btn__icon">♂</span><span class="btn__text">乾造 (男)</span>
                            </div>
                            <div class="btn"><span class="btn__icon">♀</span><span class="btn__text">坤造 (女)</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-item">
                    <div class="form-item-label"><span class="form-item-label__text">历法类型</span></div>
                    <div class="form-item-value">
                        <div class="btn-group">
                            <div class="btn is-active"><span class="btn__text">公历 (太阳历)</span>
                            </div>
                            <div class="btn"><span class="btn__text">农历 (阴阳历)</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-item">
                    <div class="form-item-label"><span class="form-item-label__icon">*</span><span class="form-item-label__text">出生时间</span></div>
                    <div class="form-item-value">
                        <div class="form-item-value__input-group">
                            <input type="text" class="form-item-value__input" placeholder="请选择年" value="1990年" />
                            <input type="text" class="form-item-value__input" placeholder="请选择月" value="01月" />
                            <input type="text" class="form-item-value__input" placeholder="请选择日" value="01日" />
                            <input type="text" class="form-item-value__input" placeholder="请选择时" value="辰时 07-09" />
                        </div>
                    </div>
                </div>
                <div class="form-item">
                    <div class="form-item-label"><span class="form-item-label__text">出生地</span></div>
                    <div class="form-item-value">
                        <div class="form-item-value__input-group">
                            <input type="text" class="form-item-value__input" placeholder="请选择省" value="" />
                            <input type="text" class="form-item-value__input" placeholder="请选择市" value="" />
                            <input type="text" class="form-item-value__input" placeholder="请选择区/县" value="" />
                        </div>
                    </div>
                    <div class="form-item-note"><span class="form-item-note__text">* 选择准确出生地区可自动校准真太阳时</span></div>
                </div>                
                <div class="form-item">
                    <div class="btn-submit"><span class="btn-submit-text">起 盘 观 命</span></div>
                </div>
            </div>
            <div class="page-body-link"><span class="page-body-link-text">“命由天定，运由己造。观星揽月，知命立身。”</span></div>
        </div>
    </div>
</body>

</html>
